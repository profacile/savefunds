name: SaveFunds CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savefunds-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test backend
        run: ./mvnw test

  angular-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savefunds-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Angular dependencies
        run: npm ci
      - name: Build Angular frontend
        run: npm run build
